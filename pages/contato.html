<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TripWay - Contato</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header>
<h2>TripWay</h2>
<nav>  
<ul>
<li><a href="../index.html">Home</a></li>
<li><a href="destinos.html">Destinos</a></li>
<li><a href="pacotes.html">Pacotes</a></li>
<li><a href="contato.html">Contato</a></li>
</ul>
</nav>
</header>

<main>
<section>
<h1>Contato / Reserva</h1>
<p>Preencha para simular sua viagem:</p>
<img src="../images/equipe.jpg" alt="Equipe da TripWay pronta para ajudar no planejamento da viagem" width="600">

<form action="#" method="POST" class="form-contato">
<label for="nome">Nome:</label>
<input type="text" id="nome" name="nome" required>
<label for="email">E-mail:</label>
<input type="email" id="email" name="email" required>
<label for="destino">Destino:</label>
<select id="destino" name="destino" required>
<option value="">Selecione</option>
<option>Kingston - Jamaica</option>
<option>Ilha Santorini - Grécia</option>
<option>Jalapão - Brasil</option>
</select>
<label for="data">Data da viagem:</label>
<input type="date" id="data" name="data" required>
<label for="pessoas">Quantidade de pessoas:</label>
<input type="number" id="pessoas" name="pessoas" min="1" required>
<label for="mensagem">Mensagem:</label>
<textarea id="mensagem" name="mensagem" rows="5"></textarea>
<button type="submit" class="btn btn-primario">Enviar</button>
</form>

</section>
</main>

<footer>
<p>© 2026 TripWay</p>
</footer>

</body>
</html>
