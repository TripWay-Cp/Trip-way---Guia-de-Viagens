<main>
<section>
<h1>Contato / Reserva</h1>
<p>Preencha para simular sua viagem:</p>
<img src="../images/equipe.jpg" alt="Equipe da TripWay pronta para ajudar no planejamento da viagem" width="600">

<form action="#" method="POST">
<label>Nome:<br><input type="text" name="nome" required></label><br><br>
<label>E-mail:<br><input type="email" name="email" required></label><br><br>
<label>Destino:<br>
<select name="destino" required>
<option value="">Selecione</option>
<option>Kingston - Jamaica</option>
<option>Ilha Santorini - Grécia</option>
<option>Jalapão - Brasil</option>
</select>
</label><br><br>
<label>Data:<br><input type="date" name="data" required></label><br><br>
<label>Pessoas:<br><input type="number" name="pessoas" min="1" required></label><br><br>
<label>Mensagem:<br><textarea name="mensagem" required></textarea></label><br><br>
<button type="submit">Enviar</button>
</form>

</section>
</main>

<footer>
<p>© 2026 TripWay</p>
</footer>

</body>
